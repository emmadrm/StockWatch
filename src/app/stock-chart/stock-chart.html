<div class="chart-header">
  <h3>Ιστορικό τιμών</h3>
  <span class="mock-badge">δοκιμαστικά δεδομένα</span>
</div>
<div class="chart-container">
  @if (candles.isLoading()) {
    <p class="status">Φόρτωση γραφήματος...</p>
  } @else if (candles.error() || candles.value()?.s !== 'ok') {
    <p class="status">Δεν ήταν δυνατή η φόρτωση ιστορικών τιμών για {{ symbol() }}.</p>
  }
  <canvas #canvas></canvas>
</div>
