<div class="brand">
  <img src="logo.jpg" alt="StockWatch logo">
  <span>StockWatch</span>
</div>

<form (submit)="$event.preventDefault(); onSearch()">
  <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="currentColor" viewBox="0 0 16 16">
    <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
  </svg>
  <input #searchStock id="searchStock" type="text" placeholder="Αναζήτηση μετοχής (π.χ. AAPL)…" name="searchStock" autocomplete="off">
  <button type="submit">Αναζήτηση</button>
</form>

<nav>
  <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Dashboard</a>
  <a routerLink="/portfolio" routerLinkActive="active">Portfolio</a>
</nav>
