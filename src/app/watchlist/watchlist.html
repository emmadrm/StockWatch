<div class="watchlist">
  <h3>Watchlist</h3>
  @if (symbols().length === 0) {
    <p class="empty">Δεν έχεις προσθέσει ακόμα μετοχές.</p>
  } @else {
    <ul>
      @for (symbol of symbols(); track symbol) {
        <li>
          <button type="button" class="symbol-btn" (click)="selectSymbol.emit(symbol)">
            {{ symbol }}
          </button>
          <button type="button" class="remove-btn" (click)="remove(symbol)">✕</button>
        </li>
      }
    </ul>
  }
</div>
